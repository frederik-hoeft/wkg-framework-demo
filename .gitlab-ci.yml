image: mcr.microsoft.com/dotnet/sdk:10.0-alpine

variables:
  OBJECTS_DIRECTORY: 'artifacts/obj'
  NUGET_PACKAGES_DIRECTORY: '.nuget'
  SOURCE_CODE_PATH: './source/Cloudbb'

cache:
  # Per-stage and per-branch caching.
  key: "$CI_JOB_STAGE-$CI_COMMIT_REF_SLUG"
  paths:
    # Main JSON file holding information about package dependency tree, packages versions,
    - '$SOURCE_CODE_PATH$OBJECTS_DIRECTORY/*/project.assets.json'
    # Other NuGet and MSBuild related files. Also needed.
    - '$SOURCE_CODE_PATH$OBJECTS_DIRECTORY/*/*.csproj.nuget.*'
    # Path to the directory where restored dependencies are kept.
    - '$NUGET_PACKAGES_DIRECTORY'
  policy: pull-push

before_script:
  - 'dotnet restore "${SOURCE_CODE_PATH}" --packages "${NUGET_PACKAGES_DIRECTORY}"'

build:
  stage: build
  script:
    - 'dotnet build "${SOURCE_CODE_PATH}" --no-restore'

tests:
  stage: test
  script:
    - 'dotnet test "${SOURCE_CODE_PATH}" --no-restore'

deploy:
  stage: deploy
  script: echo "Define your deployment script!"
  environment: production