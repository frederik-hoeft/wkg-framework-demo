stages:
  - build
  - test
  - prepare-deploy
  - deploy

variables:
  DOTNET_SDK_TAG: '10.0-alpine'
  OBJECTS_DIRECTORY: 'artifacts/obj'
  NUGET_PACKAGES_DIRECTORY: '.nuget'
  SOURCE_CODE_PATH: './source/Cloudbb'
  MAJOR_VERSION: '0'
  MINOR_VERSION: '1'

.dotnet-base:
  image: "mcr.microsoft.com/dotnet/sdk:${DOTNET_SDK_TAG}"
  cache:
    # Per-stage and per-branch caching.
    key: "$CI_JOB_STAGE-$CI_COMMIT_REF_SLUG"
    paths:
      # Main JSON file holding information about package dependency tree, packages versions,
      - '$SOURCE_CODE_PATH/$OBJECTS_DIRECTORY/*/project.assets.json'
      # Other NuGet and MSBuild related files. Also needed.
      - '$SOURCE_CODE_PATH/$OBJECTS_DIRECTORY/*/*.csproj.nuget.*'
      # Path to the directory where restored dependencies are kept.
      - '$NUGET_PACKAGES_DIRECTORY'
    policy: pull-push
  before_script:
    - 'dotnet restore "${SOURCE_CODE_PATH}" --packages "${NUGET_PACKAGES_DIRECTORY}"'

build:
  extends: .dotnet-base
  stage: build
  script:
    - 'dotnet build "${SOURCE_CODE_PATH}" --no-restore'

tests:
  extends: .dotnet-base
  stage: test
  script:
    - 'dotnet test "${SOURCE_CODE_PATH}" --no-restore'

construct-version:
  image: debian:trixie-slim
  stage: prepare-deploy
  script:
    - |
      set -euvo pipefail
      export VERSION="${MAJOR_VERSION}.${MINOR_VERSION}.${CI_PIPELINE_IID}"
      echo "base version: ${VERSION}"
      mkdir -p app
      # check if we're on main. if not, append branch or tag name as pre-release label
      PRE_RELEASE_LABEL=""
      if [ "${CI_COMMIT_REF_SLUG}" != "main" ]; then
        echo "non-main branch detected: ${CI_COMMIT_REF_SLUG}"
        PRE_RELEASE_LABEL="-${CI_COMMIT_REF_SLUG}"
      fi
      FULL_VERSION="${VERSION}${PRE_RELEASE_LABEL}"
      echo "${FULL_VERSION}" | tee app/version.txt
  artifacts:
    paths:
      - app

deploy-container-image:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:v1.23.0-debug
    entrypoint: ["/busybox/sh", "-c"]
  needs:
    - construct-version
  variables:
    DOCKER_CONTEXT_PATH: "${SOURCE_CODE_PATH}"
    DOCKERFILE_PATH: "${SOURCE_CODE_PATH}/Cloudbb.Web/Dockerfile"
  script:
    - export VERSION="$(cat app/version.txt)"
    - |
      if [ -z "$VERSION" ]; then
        echo "Version file was empty!"
        exit 1
      fi
    # inject version info into build context
    - echo "${VERSION}" | tee "${DOCKER_CONTEXT_PATH}/CI_VERSION_INFO"
    - mkdir -p /kaniko/.docker
    - |
      set -euvo pipefail
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - |
      set -euvo pipefail
      # only set latest tag for main branch builds
      if [ "$CI_COMMIT_REF_SLUG" != "main" ]; then
        /kaniko/executor --context "${DOCKER_CONTEXT_PATH}" --dockerfile "${DOCKERFILE_PATH}" --destination "${CI_REGISTRY_IMAGE}:${VERSION}"
      else
        /kaniko/executor --context "${DOCKER_CONTEXT_PATH}" --dockerfile "${DOCKERFILE_PATH}" --destination "${CI_REGISTRY_IMAGE}:${VERSION}" --destination "${CI_REGISTRY_IMAGE}:latest"
      fi